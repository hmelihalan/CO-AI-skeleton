services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coai}
      POSTGRES_USER: ${POSTGRES_USER:-coai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coai_local_password}
    ports:
      - "5432:5432"
    volumes:
      - coai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  coai_postgres_data:
