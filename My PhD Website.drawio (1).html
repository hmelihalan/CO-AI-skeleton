t -&amp;gt; DB: Create export-run record\\n        Export -&amp;gt; DB: Insert export-request audit entry\\n        Export -&amp;gt; DB: COMMIT\\n\\n        Export -&amp;gt; DB: Start read-only transaction\\n\\n        alt Standard export\\n            Export -&amp;gt; DB: Load filtered records\\\\nfor selected export kind\\n            DB --&amp;gt; Export: Research records and provenance\\n            Export -&amp;gt; Export: Apply exclude / scrub / include\\\\nfree-text policy\\n            Export -&amp;gt; Serializer: Serialize selected CSV or JSON\\n        else action_sequences / ena_input / dsm_input\\n            Export -&amp;gt; DB: Load structural event data,\\\\nAI metadata, task runs,\\\\nand message IDs / positions\\n            note right of DB\\n            Message text is not selected.\\n            client_error free-text payload is blanked.\\n            end note\\n            DB --&amp;gt; Export: Structural records\\n            Export -&amp;gt; Actions: Derive actions per session using R01-R51\\n\\n            Actions -&amp;gt; Actions: Map eligible source records\\\\nto at most one action each\\n            Actions -&amp;gt; Actions: Count explicit exclusions;\\\\nfail on unknown or reserved event types\\n            Actions -&amp;gt; Actions: Build separate sequence per task run\\n            Actions -&amp;gt; Actions: Order by effective time,\\\\nsource priority, seq, and ID\\n            Actions -&amp;gt; Actions: Annotate original index,\\\\nFirst/Repeat, timing, evidence,\\\\nsource IDs, rule/version, and sequence hash\\n            Actions --&amp;gt; Export: Annotated action sequences\\n\\n            alt action_sequences\\n                Export -&amp;gt; Serializer: Serialize all derived actions\\n            else ena_input or dsm_input\\n                Export -&amp;gt; Export: Apply core@0.1.0 filter;\\\\nremove two attention action types\\n                Export -&amp;gt; Export: Retain original IDs and indices;\\\\nadd filtered indices and adjacency metadata\\n\\n                alt ena_input\\n                    Export -&amp;gt; Serializer: Serialize one-hot action columns\\n                else dsm_input\\n                    Export -&amp;gt; Serializer: Serialize long-format action rows\\n                end\\n            end\\n        end\\n\\n        Export -&amp;gt; DB: End read-only transaction\\n\\n        alt Derivation or serialization fails\\n            Export -&amp;gt; DB: Record failed run and audit outcome\\n            Export --&amp;gt; API: Export failure\\n            API --&amp;gt; UI: Show failed run in export history\\n        else Export succeeds\\n            Serializer --&amp;gt; Export: Exact file bytes and columns\\n            Export -&amp;gt; Export: Compute file SHA-256 and byte size\\n            Export -&amp;gt; Export: Build manifest with filters,\\\\nprivacy mode, counts, configuration,\\\\nprovider provenance, and synthetic flag\\n\\n            opt Derived-action export\\n                Export -&amp;gt; Export: Add vocabulary, rules, filter,\\\\nthreshold status, exclusions,\\\\nsequence semantics, and hashes\\n            end\\n\\n            Export -&amp;gt; DB: BEGIN\\n            Export -&amp;gt; DB: Finalize export run and immutable manifest\\n            Export -&amp;gt; DB: Insert completion audit entry\\n            Export -&amp;gt; DB: COMMIT\\n            Export --&amp;gt; API: Export file and run identifier\\n            API --&amp;gt; UI: Return downloadable file\\n\\n            Admin -&amp;gt; UI: Download manifest\\n            UI -&amp;gt; API: GET /api/admin/exports/{runId}/manifest\\n            API -&amp;gt; Auth: Verify ADMIN access\\n            Auth --&amp;gt; API: Authorized\\n            API -&amp;gt; Export: Load completed manifest\\n            Export -&amp;gt; DB: Read manifest\\n            DB --&amp;gt; Export: Manifest\\n            API --&amp;gt; UI: Return manifest\\n        end\\n    end\\nend\\n\\nnote over Actions, Serializ
